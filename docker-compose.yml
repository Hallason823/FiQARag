version: '3.8'

services:
  fiqa-rag-api:
    build:
      context: ./fiqa-rag-api
      dockerfile: Dockerfile
    container_name: fiqa-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  fiqa-rag-ui:
    build:
      context: ./fiqa-rag-ui
      dockerfile: Dockerfile
    container_name: fiqa-rag-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - fiqa-rag-api
    restart: unless-stopped